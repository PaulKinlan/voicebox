<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Waiting to Land — Branch Inspector</title>
  <style>
    :root {
      --bg-page: #fbfbf9;
      --bg-card: #ffffff;
      --bg-muted: #f3f2ee;
      --bg-subtle: #f7f6f2;
      --text-main: #23262b;
      --text-secondary: #4b5563;
      --text-muted: #6b7280;
      --border-subtle: #e5e7eb;
      --border-strong: #d1d5db;
      --accent-primary: #1f3fd0;
      --accent-primary-hover: #1a35b0;
      --accent-soft: rgba(31, 63, 208, 0.08);
      --good-bg: #dcfce7;
      --good-fg: #166534;
      --good-border: #86efac;
      --warn-bg: #fef3c7;
      --warn-fg: #92400e;
      --danger-bg: #fee2e2;
      --danger-fg: #991b1b;
      --danger-border: #fca5a5;
      --diff-add-bg: #ecfdf5;
      --diff-add-fg: #065f46;
      --diff-del-bg: #fef2f2;
      --diff-del-fg: #991b1b;
      --diff-hunk-bg: #eff6ff;
      --diff-hunk-fg: #1e40af;
      --shadow-sm: 0 2px 8px rgba(20, 22, 26, 0.05);
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-page: #0b0f19;
        --bg-card: #151d2f;
        --bg-muted: #1e293b;
        --bg-subtle: #111827;
        --text-main: #f8fafc;
        --text-secondary: #cbd5e1;
        --text-muted: #94a3b8;
        --border-subtle: #26334d;
        --border-strong: #334155;
        --accent-primary: #3b82f6;
        --accent-primary-hover: #60a5fa;
        --accent-soft: rgba(59, 130, 246, 0.16);
        --good-bg: rgba(22, 163, 74, 0.2);
        --good-fg: #86efac;
        --good-border: rgba(134, 239, 172, 0.35);
        --warn-bg: rgba(217, 119, 6, 0.2);
        --warn-fg: #fcd34d;
        --danger-bg: rgba(220, 38, 38, 0.2);
        --danger-fg: #fca5a5;
        --danger-border: rgba(252, 165, 165, 0.35);
        --diff-add-bg: rgba(16, 185, 129, 0.16);
        --diff-add-fg: #a7f3d0;
        --diff-del-bg: rgba(239, 68, 68, 0.16);
        --diff-del-fg: #fecaca;
        --diff-hunk-bg: rgba(59, 130, 246, 0.18);
        --diff-hunk-fg: #93c5fd;
        --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.35);
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-page);
      color: var(--text-main);
      line-height: 1.45;
    }

    .inspector-shell {
      max-width: 1020px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .inspector-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .app-title {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .pill-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.76rem;
      font-weight: 600;
      background: var(--bg-muted);
      color: var(--text-secondary);
      border: 1px solid var(--border-subtle);
    }

    .pill-badge.good {
      background: var(--good-bg);
      color: var(--good-fg);
      border-color: var(--good-border);
    }

    .pill-badge.conflict {
      background: var(--danger-bg);
      color: var(--danger-fg);
      border-color: var(--danger-border);
    }

    :focus-visible {
      outline: 2px solid var(--accent-primary);
      outline-offset: 2px;
    }

    .btn {
      appearance: none;
      border: 1px solid var(--border-strong);
      background: var(--bg-card);
      color: var(--text-main);
      border-radius: 999px;
      padding: 7px 14px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
    }

    .btn:hover:not(:disabled) {
      background: var(--bg-muted);
      transform: translateY(-1px);
    }

    .btn:focus-visible:not(:disabled) {
      outline: 2px solid var(--accent-primary);
      outline-offset: 2px;
      border-color: var(--accent-primary);
    }

    .btn:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--accent-primary);
      border-color: var(--accent-primary);
      color: #ffffff;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--accent-primary-hover);
      border-color: var(--accent-primary-hover);
    }

    .inspector-grid {
      display: grid;
      grid-template-columns: 290px 1fr;
      gap: 16px;
      align-items: start;
    }

    @media (max-width: 760px) {
      .inspector-grid {
        grid-template-columns: 1fr;
      }
    }

    .panel-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 14px;
      box-shadow: var(--shadow-sm);
    }

    .panel-heading {
      margin: 0 0 10px 0;
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .branch-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .branch-item {
      width: 100%;
      text-align: left;
      background: var(--bg-subtle);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 10px 12px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 5px;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .branch-item:hover {
      border-color: var(--accent-primary);
    }

    .branch-item.is-selected {
      background: var(--accent-soft);
      border-color: var(--accent-primary);
    }

    .branch-item-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .branch-name {
      font-family: var(--mono);
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-main);
      word-break: break-all;
    }

    .branch-commit {
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    .branch-subject {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin: 0;
    }

    .branch-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.73rem;
      font-family: var(--mono);
      color: var(--text-muted);
      flex-wrap: wrap;
    }

    .detail-column {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .review-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .review-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .action-status {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-top: 8px;
    }

    .changed-files-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .changed-file-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 7px 10px;
      border-radius: 8px;
      background: var(--bg-subtle);
      border: 1px solid var(--border-subtle);
      font-family: var(--mono);
      font-size: 0.79rem;
    }

    .file-path-group {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .file-status-tag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      border-radius: 5px;
      font-size: 0.72rem;
      font-weight: 700;
      background: var(--bg-muted);
      color: var(--text-main);
    }

    .file-stats {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .stat-add {
      color: var(--good-fg);
      font-weight: 700;
    }

    .stat-del {
      color: var(--danger-fg);
      font-weight: 700;
    }

    .diff-viewer {
      background: var(--bg-subtle);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 10px 0;
      font-family: var(--mono);
      font-size: 0.78rem;
      line-height: 1.5;
      max-height: 360px;
      overflow: auto;
    }

    .diff-line {
      padding: 1px 12px;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .diff-line.is-add {
      background: var(--diff-add-bg);
      color: var(--diff-add-fg);
    }

    .diff-line.is-del {
      background: var(--diff-del-bg);
      color: var(--diff-del-fg);
    }

    .diff-line.is-hunk {
      background: var(--diff-hunk-bg);
      color: var(--diff-hunk-fg);
      font-weight: 600;
    }

    .empty-state {
      padding: 18px;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <main class="inspector-shell">
    <header class="inspector-header">
      <div class="title-group">
        <h1 class="app-title">Waiting to Land — Branch Inspector</h1>
        <span class="pill-badge" id="base-branch-badge">Base: main</span>
        <span class="pill-badge" id="candidate-count">2 Candidate Branches</span>
      </div>
      <button id="refresh-branches-btn" type="button" class="btn">
        Refresh Branches
      </button>
    </header>

    <div class="inspector-grid">
      <section class="panel-card" aria-label="Candidate Branches">
        <h2 class="panel-heading">
          <span>Candidate Branches</span>
        </h2>
        <div id="branch-list" class="branch-list"></div>
      </section>

      <div class="detail-column">
        <section class="panel-card" aria-label="Branch Review Controls">
          <div class="review-toolbar">
            <div>
              <h2 class="panel-heading" id="selected-branch-heading">Selected Candidate Branch</h2>
              <span class="pill-badge good" id="merge-compatibility-badge">Clean Merge Ready</span>
            </div>
            <div class="review-actions">
              <button id="land-branch-btn" type="button" class="btn btn-primary">
                Land into Main
              </button>
              <button id="keep-separate-btn" type="button" class="btn">
                Keep Separate
              </button>
            </div>
          </div>
          <div id="review-action-status" class="action-status" aria-live="polite"></div>
        </section>

        <section class="panel-card" aria-label="Changed Files Summary">
          <h2 class="panel-heading">
            <span>Changed Files</span>
            <span id="totals-summary">+0 / -0</span>
          </h2>
          <div id="changed-files-list" class="changed-files-list"></div>
        </section>

        <section class="panel-card" aria-label="Unified Diff">
          <h2 class="panel-heading">
            <span>Unified Diff Against Main</span>
          </h2>
          <div id="diff-viewer" class="diff-viewer"></div>
        </section>
      </div>
    </div>
  </main>

  <script src="/apps/landing-inspector.js"></script>
</body>
</html>
