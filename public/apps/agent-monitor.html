<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agent Progress Tracker</title>
  <style>
    :root {
      --bg-page: #fbfbf9;
      --bg-card: #ffffff;
      --bg-muted: #f3f2ee;
      --text-main: #18181b;
      --text-secondary: #52525b;
      --text-muted: #71717a;
      --border-subtle: #e4e4e7;
      --border-strong: #d4d4d8;
      --accent-primary: #2563eb;
      --accent-primary-hover: #1d4ed8;
      --status-green-bg: #dcfce7;
      --status-green-fg: #166534;
      --status-green-dot: #16a34a;
      --status-blue-bg: #dbeafe;
      --status-blue-fg: #1e40af;
      --status-blue-dot: #2563eb;
      --status-amber-bg: #fef3c7;
      --status-amber-fg: #92400e;
      --status-amber-dot: #d97706;
      --status-red-bg: #fee2e2;
      --status-red-fg: #991b1b;
      --status-red-dot: #dc2626;
      --status-gray-bg: #f4f4f5;
      --status-gray-fg: #52525b;
      --status-gray-dot: #a1a1aa;
      --shadow-sm: 0 1px 2px rgba(24, 24, 27, 0.05);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-page: #0b0f19;
        --bg-card: #151d2f;
        --bg-muted: #1e293b;
        --text-main: #f8fafc;
        --text-secondary: #cbd5e1;
        --text-muted: #94a3b8;
        --border-subtle: #26334d;
        --border-strong: #334155;
        --accent-primary: #3b82f6;
        --accent-primary-hover: #60a5fa;
        --status-green-bg: rgba(22, 163, 74, 0.18);
        --status-green-fg: #86efac;
        --status-green-dot: #22c55e;
        --status-blue-bg: rgba(37, 99, 235, 0.2);
        --status-blue-fg: #93c5fd;
        --status-blue-dot: #60a5fa;
        --status-amber-bg: rgba(217, 119, 6, 0.2);
        --status-amber-fg: #fcd34d;
        --status-amber-dot: #f59e0b;
        --status-red-bg: rgba(220, 38, 38, 0.2);
        --status-red-fg: #fca5a5;
        --status-red-dot: #ef4444;
        --status-gray-bg: rgba(148, 163, 184, 0.14);
        --status-gray-fg: #cbd5e1;
        --status-gray-dot: #64748b;
        --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.35);
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-page);
      color: var(--text-main);
      line-height: 1.45;
    }

    .app-shell {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .app-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .header-title-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .app-title {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 650;
      letter-spacing: -0.01em;
    }

    .connected-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
      background: var(--status-green-bg);
      color: var(--status-green-fg);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    :focus-visible {
      outline: 2px solid var(--accent-primary);
      outline-offset: 2px;
    }

    .btn {
      appearance: none;
      border: 1px solid var(--border-strong);
      background: var(--bg-card);
      color: var(--text-main);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.82rem;
      font-weight: 550;
      cursor: pointer;
      transition: background 120ms ease, border-color 120ms ease;
    }

    .btn:hover {
      background: var(--bg-muted);
    }

    .btn:focus-visible {
      outline: 2px solid var(--accent-primary);
      outline-offset: 2px;
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn-primary {
      background: var(--accent-primary);
      border-color: var(--accent-primary);
      color: #ffffff;
    }

    .btn-primary:hover {
      background: var(--accent-primary-hover);
      border-color: var(--accent-primary-hover);
    }

    .section-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 14px;
      box-shadow: var(--shadow-sm);
    }

    .section-label {
      margin: 0 0 10px 0;
      font-size: 0.78rem;
      font-weight: 650;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
    }

    .harness-bar {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 10px;
    }

    .harness-pill {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-page);
    }

    .harness-pill[data-status="active"] {
      border-color: var(--status-green-dot);
    }

    .harness-pill-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .harness-name {
      font-weight: 600;
      font-size: 0.88rem;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      display: inline-block;
      background: var(--status-gray-dot);
    }

    .status-dot.active {
      background: var(--status-green-dot);
    }

    .status-dot.ready {
      background: var(--status-blue-dot);
    }

    .harness-status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      font-size: 0.76rem;
      color: var(--text-secondary);
    }

    .pill-toggle-btn {
      padding: 3px 8px;
      font-size: 0.74rem;
      border-radius: 6px;
    }

    .dispatch-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .target-checkboxes {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .target-check-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-page);
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      user-select: none;
    }

    .dispatch-input-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .prompt-input {
      flex: 1 1 260px;
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid var(--border-strong);
      background: var(--bg-page);
      color: var(--text-main);
      font-size: 0.88rem;
    }

    .tasks-board {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .empty-board {
      padding: 20px;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.88rem;
      border: 1px dashed var(--border-subtle);
      border-radius: 10px;
    }

    .task-item {
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 12px;
      background: var(--bg-page);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .task-item-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .task-badges {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .harness-tag {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      background: var(--bg-muted);
      color: var(--text-main);
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 9px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      background: var(--status-gray-bg);
      color: var(--status-gray-fg);
    }

    .status-pill[data-state="running"],
    .status-pill[data-state="queued"] {
      background: var(--status-blue-bg);
      color: var(--status-blue-fg);
    }

    .status-pill[data-state="completed"] {
      background: var(--status-green-bg);
      color: var(--status-green-fg);
    }

    .status-pill[data-state="interrupted"],
    .status-pill[data-state="failed"] {
      background: var(--status-red-bg);
      color: var(--status-red-fg);
    }

    .status-pill[data-state="cancelled"],
    .status-pill[data-state="cancel_requested"],
    .status-pill[data-state="cancel_unconfirmed"] {
      background: var(--status-amber-bg);
      color: var(--status-amber-fg);
    }

    @keyframes pulse-opacity {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: currentColor;
      animation: pulse-opacity 1.4s infinite ease-in-out;
    }

    .task-elapsed {
      font-size: 0.76rem;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    .task-prompt-text {
      margin: 0;
      font-size: 0.88rem;
      font-weight: 550;
      color: var(--text-main);
    }

    .task-stage-line {
      font-size: 0.8rem;
      color: var(--text-secondary);
    }

    .task-detail-drawer {
      font-size: 0.78rem;
      color: var(--text-secondary);
      border-top: 1px solid var(--border-subtle);
      padding-top: 6px;
    }

    .task-detail-drawer summary {
      cursor: pointer;
      font-weight: 550;
      color: var(--text-secondary);
    }

    .task-detail-pre {
      margin: 6px 0 0 0;
      padding: 8px;
      border-radius: 6px;
      background: var(--bg-muted);
      color: var(--text-main);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.76rem;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 180px;
      overflow-y: auto;
    }

    .compare-panel {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .synthesis-banner {
      padding: 10px 12px;
      border-radius: 8px;
      background: var(--status-blue-bg);
      color: var(--status-blue-fg);
      font-size: 0.84rem;
      font-weight: 550;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .comparison-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
    }

    .comparison-col {
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 12px;
      background: var(--bg-page);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
    }

    .comparison-col[data-winner="true"] {
      border-color: var(--status-green-dot);
      box-shadow: 0 0 0 1px var(--status-green-dot);
    }

    .comparison-meta {
      font-size: 0.76rem;
      color: var(--text-secondary);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .comparison-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-top: 6px;
      border-top: 1px solid var(--border-subtle);
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div class="header-title-group">
        <h1 class="app-title">Agent Progress Tracker</h1>
        <span id="connected-count" class="connected-badge">2 Harnesses Connected</span>
      </div>
      <div class="header-actions">
        <button id="refresh-btn" type="button" class="btn">Refresh</button>
      </div>
    </header>

    <section class="section-card" aria-label="Connected Harnesses">
      <h2 class="section-label">Connected Harnesses</h2>
      <div id="harness-bar" class="harness-bar"></div>
    </section>

    <section class="section-card" aria-label="Simultaneous Multi-Harness Dispatcher">
      <h2 class="section-label">Run Task Across Harnesses</h2>
      <form id="dispatch-form" class="dispatch-form">
        <div id="target-harness-list" class="target-checkboxes">
          <label class="target-check-label">
            <input type="checkbox" name="target-harness" value="pi" checked />
            <span>Pi</span>
          </label>
          <label class="target-check-label">
            <input type="checkbox" name="target-harness" value="claude" checked />
            <span>Claude Code</span>
          </label>
          <label class="target-check-label">
            <input type="checkbox" name="target-harness" value="antigravity" />
            <span>Antigravity</span>
          </label>
          <label class="target-check-label">
            <input type="checkbox" name="target-harness" value="codex" />
            <span>Codex</span>
          </label>
          <label class="target-check-label">
            <input type="checkbox" name="target-harness" value="opencode" />
            <span>OpenCode</span>
          </label>
        </div>
        <div class="dispatch-input-row">
          <input
            id="task-prompt-input"
            class="prompt-input"
            type="text"
            aria-label="Multi-harness task prompt"
            placeholder="Ask selected harnesses to build, test, or investigate in parallel..."
            required
          />
          <button id="dispatch-submit" type="submit" class="btn btn-primary">
            Run Across Selected Harnesses
          </button>
        </div>
      </form>
    </section>

    <section id="compare-results-panel" class="section-card compare-panel" aria-label="Multi-Harness Result Comparison">
      <h2 class="section-label">Side-by-Side Result Comparison &amp; Diff Synthesis</h2>
      <div id="synthesis-summary" class="synthesis-banner">
        Run a task across two or more harnesses to compare patches, touched files, and completion speed side by side.
      </div>
      <div id="comparison-grid" class="comparison-grid"></div>
    </section>

    <section class="section-card" aria-label="Live Multi-Harness Progress Board">
      <h2 class="section-label">Live Agent Runs</h2>
      <div id="tasks-board" class="tasks-board"></div>
    </section>
  </main>

  <script src="/apps/agent-monitor.js"></script>
</body>
</html>
